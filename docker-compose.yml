services:
  postgres:
    image: postgres:16-alpine
    container_name: traveltech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trip_db
      POSTGRES_USER: traveltech
      POSTGRES_PASSWORD: traveltech_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveltech -d trip_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: traveltech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: traveltech-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: