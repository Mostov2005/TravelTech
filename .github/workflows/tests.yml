name: TravelTech CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/trip_service/requirements.txt
          pip install -r services/flight_service/requirements.txt
          pip install -r services/recovery_service/requirements.txt
          pip install -r services/flight_monitoring_service/requirements.txt
          pip install -r services/identity_service/requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest services/ -v
