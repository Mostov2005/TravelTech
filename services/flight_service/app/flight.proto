
syntax = "proto3";

package flight;

service FlightService {
    rpc GetFlight (GetFlightRequest) returns (FlightResponse);
}

message GetFlightRequest {
    string flight_id = 1;
}

message FlightResponse {
    string id = 1;
    string flight_number = 2;
    string airline = 3;
    string departure_airport = 4;
    string arrival_airport = 5;
    string departure_time = 6;
    string arrival_time = 7;
}
